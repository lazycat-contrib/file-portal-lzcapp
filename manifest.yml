name: File Management Portal
package: cloud.lazycat.app.file-portal
version: 0.1.0
min_os_version: 1.3.8
description: 一个简单的基于 Web 的文件上传器
homepage: https://github.com/iAmSaugata/file-portal
author: iAmSaugata
application:
  subdomain: file-portal
  background_task: true
  public_path:
    - /
  routes:
    - /=http://file-portal:8080/
    - /tool=file:///lzcapp/pkg/content/
services:
  file-portal:
    # ghcr.io/dockers-x/file-portal:0.1.0
    image: registry.lazycat.cloud/czyt/dockers-x/file-portal:c5603b876fbaee1c
    environment:
      - PORT=8080
      - SESSION_SECRET={{ stable_secret "session#fp_secret" }}
      - AUTH_BCRYPT_HASH=$$2a$$10$1THnuA82saNkEnWsHCNlMe4HVCIfcKYtqlNRa/WQFjHTMHXN/TqCq
      - MAX_UPLOAD_MB=100
      - BASE_URL=https://{{.S.AppDomain}}
      - BRAND_TITLE={{.U.brand_title}}
      - FOOTER_TEXT={{.U.footer_text}}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=200
      - DOWNLOAD_RATE_LIMIT_MAX=60
      - LINK_TTL_MS=86400000 # 24 hours
      - TRUST_PROXY=1 # Cloudflare / any reverse proxy
      - UPLOAD_CONCURRENCY=3
    binds:
      - /lzcapp/var/uploads:/app/uploads
      - /lzcapp/var/db:/app/sqlite

locales:
  zh:
    name: "文件管理门户"
    description: "一个简单的基于 Web 的文件上传器"
  en:
    name: "File Management Portal"
    description: "A simple web-based File Uploader."
