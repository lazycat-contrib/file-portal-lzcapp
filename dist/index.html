<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bcrypt 密码生成器</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .container {
                background: white;
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                padding: 40px;
                max-width: 600px;
                width: 100%;
            }

            h1 {
                color: #333;
                margin-bottom: 10px;
                font-size: 28px;
            }

            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                color: #444;
                font-weight: 500;
                font-size: 14px;
            }

            input[type="password"],
            input[type="text"],
            input[type="number"] {
                width: 100%;
                padding: 12px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 15px;
                transition: border-color 0.3s;
            }

            input[type="password"]:focus,
            input[type="text"]:focus,
            input[type="number"]:focus {
                outline: none;
                border-color: #667eea;
            }

            .cost-info {
                font-size: 12px;
                color: #888;
                margin-top: 4px;
            }

            button {
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
            }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

            button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            .result {
                margin-top: 30px;
                padding: 20px;
                background: #f7f9fc;
                border-radius: 8px;
                border-left: 4px solid #667eea;
                display: none;
            }

            .result.show {
                display: block;
                animation: fadeIn 0.3s;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .result-label {
                font-size: 14px;
                color: #666;
                margin-bottom: 10px;
                font-weight: 500;
            }

            .hash-output {
                background: white;
                padding: 12px;
                border-radius: 6px;
                font-family: "Courier New", monospace;
                font-size: 13px;
                word-break: break-all;
                color: #333;
                border: 1px solid #e0e0e0;
            }

            .copy-btn {
                margin-top: 12px;
                padding: 8px 16px;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
                transition: background 0.2s;
                width: auto;
            }

            .copy-btn:hover {
                background: #5568d3;
                transform: none;
                box-shadow: none;
            }

            .copy-btn.copied {
                background: #10b981;
            }

            .toggle-password {
                position: relative;
            }

            .toggle-btn {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: #666;
                cursor: pointer;
                padding: 4px;
                font-size: 14px;
                width: auto;
            }

            .toggle-btn:hover {
                color: #667eea;
                transform: translateY(-50%);
                box-shadow: none;
            }

            .loading {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 2px solid #ffffff;
                border-radius: 50%;
                border-top-color: transparent;
                animation: spin 0.8s linear infinite;
                margin-right: 8px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .error {
                color: #dc2626;
                font-size: 13px;
                margin-top: 8px;
                display: none;
            }

            .error.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🔐 Bcrypt 密码生成器</h1>
            <p class="subtitle">安全地生成 bcrypt 哈希密码</p>

            <form id="hashForm">
                <div class="form-group">
                    <label for="password">输入密码</label>
                    <div class="toggle-password">
                        <input
                            type="password"
                            id="password"
                            placeholder="请输入您的密码"
                            required
                        />
                        <button
                            type="button"
                            class="toggle-btn"
                            id="togglePassword"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cost">成本因子 (Cost Factor)</label>
                    <input
                        type="number"
                        id="cost"
                        value="10"
                        min="4"
                        max="15"
                        required
                    />
                    <div class="cost-info">
                        推荐值: 10-12 (值越大越安全，但计算时间越长)
                    </div>
                </div>

                <button type="submit" id="generateBtn">生成 Bcrypt 哈希</button>
                <div class="error" id="errorMsg"></div>
            </form>

            <div class="result" id="result">
                <div class="result-label">生成的 Bcrypt 哈希:</div>
                <div class="hash-output" id="hashOutput"></div>
                <button class="copy-btn" id="copyBtn">📋 复制到剪贴板</button>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
        <script>
            const form = document.getElementById("hashForm");
            const passwordInput = document.getElementById("password");
            const costInput = document.getElementById("cost");
            const generateBtn = document.getElementById("generateBtn");
            const result = document.getElementById("result");
            const hashOutput = document.getElementById("hashOutput");
            const copyBtn = document.getElementById("copyBtn");
            const togglePassword = document.getElementById("togglePassword");
            const errorMsg = document.getElementById("errorMsg");

            let currentHash = "";

            // 检查 bcrypt 是否加载
            window.addEventListener("load", () => {
                if (
                    typeof dcodeIO === "undefined" &&
                    typeof bcrypt === "undefined"
                ) {
                    errorMsg.textContent =
                        "⚠️ Bcrypt 库加载失败，请刷新页面重试";
                    errorMsg.classList.add("show");
                    generateBtn.disabled = true;
                }
            });

            // 切换密码可见性
            togglePassword.addEventListener("click", () => {
                const type =
                    passwordInput.type === "password" ? "text" : "password";
                passwordInput.type = type;
                togglePassword.textContent = type === "password" ? "👁️" : "🙈";
            });

            // 生成哈希
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const password = passwordInput.value;
                const cost = parseInt(costInput.value);

                errorMsg.classList.remove("show");

                if (!password) {
                    errorMsg.textContent = "请输入密码！";
                    errorMsg.classList.add("show");
                    return;
                }

                if (cost < 4 || cost > 15) {
                    errorMsg.textContent = "成本因子必须在 4-15 之间！";
                    errorMsg.classList.add("show");
                    return;
                }

                // 显示加载状态
                generateBtn.disabled = true;
                generateBtn.innerHTML =
                    '<span class="loading"></span>生成中...';
                result.classList.remove("show");

                try {
                    // 检查 bcrypt 对象
                    const bcryptLib =
                        typeof dcodeIO !== "undefined"
                            ? dcodeIO.bcrypt
                            : bcrypt;

                    if (!bcryptLib) {
                        throw new Error("Bcrypt 库未正确加载");
                    }

                    // 生成 salt 和 hash
                    const salt = bcryptLib.genSaltSync(cost);
                    const hash = bcryptLib.hashSync(password, salt);

                    currentHash = hash;
                    hashOutput.textContent = hash;
                    result.classList.add("show");
                    copyBtn.textContent = "📋 复制到剪贴板";
                    copyBtn.classList.remove("copied");
                } catch (error) {
                    console.error("生成错误:", error);
                    errorMsg.textContent = "生成哈希时出错: " + error.message;
                    errorMsg.classList.add("show");
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = "生成 Bcrypt 哈希";
                }
            });

            // 复制到剪贴板
            copyBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(currentHash);
                    copyBtn.textContent = "✅ 已复制！";
                    copyBtn.classList.add("copied");

                    setTimeout(() => {
                        copyBtn.textContent = "📋 复制到剪贴板";
                        copyBtn.classList.remove("copied");
                    }, 2000);
                } catch (error) {
                    // 降级方案
                    const textarea = document.createElement("textarea");
                    textarea.value = currentHash;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textarea);

                    copyBtn.textContent = "✅ 已复制！";
                    copyBtn.classList.add("copied");

                    setTimeout(() => {
                        copyBtn.textContent = "📋 复制到剪贴板";
                        copyBtn.classList.remove("copied");
                    }, 2000);
                }
            });
        </script>
    </body>
</html>
