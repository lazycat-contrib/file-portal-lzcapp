version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/file-portal.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: file-portal

build:
  run_buildscript: false

images:
  - id: file-portal
    target: service
    service: file-portal
    source: ghcr.io/dockers-x/file-portal
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: File Management Portal
    summary: "一个简单的基于 Web 的文件上传器"
